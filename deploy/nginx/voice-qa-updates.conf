server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 124.223.218.142;

    location ^~ /.well-known/acme-challenge/ {
        root /srv/voice-qa;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://124.223.218.142$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 124.223.218.142;

    ssl_certificate /etc/letsencrypt/live/voice-qa-updates/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice-qa-updates/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers PROFILE=SYSTEM;
    ssl_session_cache shared:VOICE_QA_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /voice-qa/latest.json {
        alias /srv/voice-qa/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /voice-qa/ {
        alias /srv/voice-qa/;
        autoindex off;
        limit_except GET HEAD {
            deny all;
        }
        add_header Cache-Control "public, max-age=86400, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
